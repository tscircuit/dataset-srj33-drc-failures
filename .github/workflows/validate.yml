name: Validate dataset
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun run setup:runtime
      - run: bun run verify:drc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements-verification.txt
      - run: python scripts/test-geometry-verifier.py
      - run: python scripts/verify-geometry.py
